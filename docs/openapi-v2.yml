openapi: 3.0.3
info:
  title: Movement Service API
  version: v2
  description: Movement reporting and extended features - Project II.

paths:
  /products/{productId}/movements/report:
    get:
      summary: Get movement report by date range
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: Report generated

  /cards/{cardId}/movements/latest:
    get:
      summary: Get latest 10 card movements
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Latest movements retrieved

components:
  schemas:
    MovementReport:
      type: object
      properties:
        productId: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        movements:
          type: array
          items:
            $ref: '#/components/schemas/Movement'
